{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="auth-card">
    <h1 class="page-title">Регистрация</h1>
    <p class="page-subtitle">Создайте аккаунт, чтобы подавать анкеты на усыновление и записываться на прогулки.</p>

    <form method="post" class="stack-form">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="id_username">Логин</label>
            <input type="text" name="username" id="id_username" class="form-input" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="id_email">Почта</label>
            <input type="email" name="email" id="id_email" class="form-input" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="id_password1">Пароль</label>
            <input type="password" name="password1" id="id_password1" class="form-input" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="id_password2">Повтор пароля</label>
            <input type="password" name="password2" id="id_password2" class="form-input" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>

    <p class="auth-switch">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</section>
{% endblock %}
