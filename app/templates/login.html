{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="auth-card">
    <h1 class="page-title">Вход в систему</h1>
    <p class="page-subtitle">Войдите, чтобы подать анкету на усыновление и записаться на прогулку.</p>

    <form method="post" class="stack-form">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="id_username">Логин</label>
            <input type="text" name="username" id="id_username" class="form-input" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-input" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Войти</button>
    </form>

    <p class="auth-switch">Ещё нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}
